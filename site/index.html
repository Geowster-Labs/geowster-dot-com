<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Geowster.com</title>
  <meta name="description" content="Welcome to Geowster.com">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f5;
      --fg: #1c1c1e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121214;
        --fg: #f2f2f2;
      }
    }
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    h1 {
      font-size: clamp(1.75rem, 6vw, 3.5rem);
      font-weight: 600;
      letter-spacing: -0.02em;
    }
  </style>
</head>
<body>
  <h1>Welcome to Geowster.com</h1>
</body>
</html>
